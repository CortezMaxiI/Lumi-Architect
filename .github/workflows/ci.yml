name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Test & Lint (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Lumi-Architect/requirements.txt

      - name: Run Test Suite
        run: |
          pytest tests/ -v

      - name: PowerShell Script Syntax Validation
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "Validating PowerShell syntax for all scripts..." -ForegroundColor Cyan
          $scripts = Get-ChildItem -Recurse -Filter *.ps1
          $hasErrors = $false
          foreach ($script in $scripts) {
              $tokens = $null
              $errors = $null
              $ast = [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors)
              if ($errors.Count -gt 0) {
                  Write-Host "[FAIL] Syntax error in $($script.Name):" -ForegroundColor Red
                  $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
                  $hasErrors = $true
              } else {
                  Write-Host "[PASS] $($script.Name)" -ForegroundColor Green
              }
          }
          if ($hasErrors) { exit 1 }
